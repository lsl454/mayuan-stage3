<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>马原冲刺包</title><style>:root{
  --bg:#F6F2FF; --ink:#2A1F45; --ink2:#645A7D; --ink3:#A59CBC; --line:#E9E2F7; --card:#FFFFFF;
  --vio:#7B61FF; --vio-d:#5B42E0; --vio-l:#EEE9FF;
  --mint:#1DBF94; --mint-d:#12997A; --mint-l:#DDF7EF;
  --coral:#FF6B6B; --coral-d:#E04B4B; --coral-l:#FFE7E7;
  --lemon:#FFC83D; --lemon-d:#E3A714; --lemon-l:#FFF4D4;
  --pink:#FF8FB1; --pink-d:#F06A94; --pink-l:#FFE9F1;
  --sky:#3AA8FF; --sky-d:#1C8AE0; --sky-l:#E2F2FF;
  --orange:#FF9F43; --orange-d:#E8822A; --orange-l:#FFF0E0;
  --cherry:#FF4F6D;
  --f:system-ui,-apple-system,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;
  -webkit-text-size-adjust:100%;overflow-x:hidden;
  background:
    radial-gradient(circle at 6% -4%,#FFE3EF 0,rgba(255,227,239,0) 38%),
    radial-gradient(circle at 104% 18%,#DFF1FF 0,rgba(223,241,255,0) 34%),
    radial-gradient(circle at 50% 108%,#FFF1D2 0,rgba(255,241,210,0) 42%),
    var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3{margin:0;line-height:1.3}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px;border-radius:10px}
#app{max-width:480px;margin:0 auto;padding:0 18px 40px;min-height:100vh}
#app.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ---------- 通用组件 ---------- */
.btn{--c:var(--vio);--d:var(--vio-d);appearance:none;border:0;font-weight:800;font-size:16px;color:#fff;
  background:var(--c);border-radius:16px;padding:13px 18px;box-shadow:0 4px 0 var(--d);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3;
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn:disabled{--c:#DAD4EA;--d:#C6BEDA;cursor:not-allowed}
.btn:disabled:active{transform:none;box-shadow:0 4px 0 var(--d)}
.btn.full{width:100%}
.b-mint{--c:var(--mint);--d:var(--mint-d)}
.b-coral{--c:var(--coral);--d:var(--coral-d)}
.b-lemon{--c:var(--lemon);--d:var(--lemon-d);color:var(--ink)}
.b-pink{--c:var(--pink);--d:var(--pink-d)}
.b-ghost{--c:#fff;--d:#E2DAF3;color:var(--ink)}
.btn-sm{padding:8px 13px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--d)}
.btn-sm:active{transform:translateY(3px)}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:#fff;display:grid;place-items:center;
  box-shadow:0 3px 0 #E2DAF3;cursor:pointer;color:var(--ink2);flex:none}
.ib svg{width:22px;height:22px}
.ib:active{transform:translateY(3px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:3px 10px;
  border-radius:999px;background:var(--vio-l);color:var(--vio-d);white-space:nowrap}
.c-xu{background:var(--sky-l);color:var(--sky-d)}
.c-zhe{background:var(--vio-l);color:var(--vio-d)}
.c-jing{background:var(--orange-l);color:var(--orange-d)}
.c-ke{background:var(--pink-l);color:var(--pink-d)}
.c-sa{background:var(--mint-l);color:var(--mint-d)}
.c-lun{background:var(--lemon-l);color:#B98300}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 12px 26px -18px rgba(91,66,224,.45)}

/* 顶栏 */
.tb{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%,rgba(246,242,255,0))}
.tb h1{font-size:19px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-r{display:flex;gap:8px;align-items:center}

/* ---------- 吉祥物 马小原 ---------- */
.mascot{display:block;overflow:visible}
.mascot.big{width:128px;height:132px;animation:bob 3.4s ease-in-out infinite;transform-origin:50% 92%}
.mascot.mid{width:92px;height:95px}
.mascot.mini{width:58px;height:60px}
.mascot .e-happy,.mascot .mo-open,.mascot .mo-sad,.mascot .sweat,.mascot .stars{display:none}
.m-happy .e-norm,.m-cheer .e-norm{display:none}
.m-happy .e-happy,.m-cheer .e-happy{display:inline}
.m-happy .mo-smile,.m-cheer .mo-smile,.m-sad .mo-smile{display:none}
.m-happy .mo-open,.m-cheer .mo-open{display:inline}
.m-sad .mo-sad,.m-sad .sweat{display:inline}
.m-cheer .stars{display:inline;animation:twinkle .9s ease-in-out infinite}
.mascot .e-norm{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot.m-happy{animation:hop .45s ease 2}
.mascot.m-cheer{animation:hop .45s ease 4}
.mascot.m-sad{animation:droop .9s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-14px) scale(.96,1.05)}65%{transform:translateY(0) scale(1.06,.94)}}
@keyframes droop{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}60%{transform:rotate(4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 首页 ---------- */
.hrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.streak{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 14px;
  font-weight:800;font-size:14px;box-shadow:0 3px 0 #E2DAF3;color:var(--ink3)}
.streak.on{color:var(--orange-d)}
.streak b{font-size:17px;color:inherit}
.hbtns{display:flex;gap:8px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 2px 4px}
.board{position:relative;flex:none;width:152px;border:0;padding:0;background:#fff;border-radius:20px;
  text-align:center;cursor:pointer;box-shadow:0 16px 30px -16px rgba(255,79,109,.7),0 4px 0 #F2D3DB;
  transition:transform .12s}
.board:active{transform:translateY(3px) rotate(-1deg)}
.board::after{content:"";position:absolute;left:7px;right:7px;bottom:-7px;height:14px;background:#fff;
  border-radius:0 0 16px 16px;z-index:-1;box-shadow:0 4px 0 #F2D3DB}
.board .rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px}
.board .rings i{display:block;width:10px;height:22px;border-radius:6px;background:linear-gradient(#D8D0EC,#A399C2);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.board .bh{display:block;background:var(--cherry);color:#fff;font-weight:800;font-size:14px;
  padding:14px 8px 9px;border-radius:20px 20px 0 0;letter-spacing:.08em}
.board .bn{display:block;font-size:66px;font-weight:900;line-height:1;padding:14px 0 0;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.board .bn.q{color:var(--ink3)}
.board .bu{display:block;font-size:14px;color:var(--ink2);padding:4px 0 14px;font-weight:700}
.hm{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.say{position:relative;background:#fff;border-radius:16px;padding:9px 12px;font-size:13.5px;font-weight:700;
  line-height:1.45;margin-bottom:8px;box-shadow:0 8px 18px -12px rgba(91,66,224,.5);text-align:center;max-width:190px}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;
  border-bottom:0;border-top-color:#fff}
.lvbar{display:flex;align-items:center;gap:10px;margin:18px 0 0;background:#fff;border-radius:16px;padding:10px 14px;
  box-shadow:0 3px 0 #E8E1F6}
.lvt{font-weight:900;font-size:14px;white-space:nowrap}
.xpb{flex:1;height:10px;border-radius:99px;background:var(--vio-l);overflow:hidden}
.xpb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),var(--pink));transition:width .8s}
.xpn{font-size:12.5px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.today{margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:18px;font-weight:900}
.sec-h span{font-size:13px;color:var(--ink2);font-weight:700}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.r3{background:#fff;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;
  box-shadow:0 3px 0 #E8E1F6;position:relative}
.r3:active{transform:translateY(3px);box-shadow:none}
.r3 .rw{position:relative;width:62px;height:62px}
.r3 svg{width:62px;height:62px;transform:rotate(-90deg)}
.r3 .rt{fill:none;stroke:#F0EBFB;stroke-width:7}
.r3 .rv{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.r3 .ri{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.r3 .rl{font-size:13px;font-weight:800;margin-top:6px}
.r3 .rc{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.r3 .ok{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;
  font-size:13px;font-weight:900;display:grid;place-items:center}

.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{position:relative;border-radius:22px;padding:15px 15px 14px;min-height:118px;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;box-shadow:0 4px 0 var(--td)}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--td)}
.tile .te{position:absolute;right:10px;top:8px;font-size:40px;line-height:1}
.tile .tt{font-size:17px;font-weight:900}
.tile .ts{font-size:12.5px;font-weight:700;opacity:.8}
.tile .tbar{height:6px;border-radius:9px;background:rgba(255,255,255,.55);margin-top:8px;overflow:hidden}
.tile .tbar i{display:block;height:100%;background:currentColor;border-radius:9px;opacity:.75}
.t-cards{grid-row:span 2;background:#E7E0FF;color:#4A33C4;--td:#CFC3FF;min-height:248px}
.t-cards .te{font-size:62px;right:auto;left:14px;top:14px}
.t-blitz{background:var(--lemon-l);color:#946A00;--td:#F6DE98}
.t-sq{background:var(--mint-l);color:#0C7A60;--td:#B5EBDB}
.t-exam{grid-column:span 2;background:#FFE2E6;color:#C2273F;--td:#FBC2CB;min-height:104px}
.t-exam .papers{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.t-exam .pp{background:rgba(255,255,255,.7);border-radius:10px;padding:3px 9px;font-size:12.5px;font-weight:800}
.mini3{grid-column:span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile.sm{min-height:98px;padding:12px}
.tile.sm .te{font-size:30px;right:8px;top:8px}
.tile.sm .tt{font-size:15px}
.t-wrong{background:var(--coral-l);color:#C43838;--td:#F8C4C4}
.t-kit{background:var(--sky-l);color:#1172C2;--td:#BFE1FC}
.t-ach{background:var(--pink-l);color:#C8406E;--td:#F9C6D8}
.badge-n{position:absolute;top:8px;left:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center}

.pred{margin-top:18px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 3px 0 #E8E1F6}
.pred-h{display:flex;align-items:baseline;justify-content:space-between}
.pred-h span{font-size:14px;font-weight:800;color:var(--ink2)}
.pred-h b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.pred-h b small{font-size:14px;color:var(--ink2);margin-left:2px}
.pbar{position:relative;height:14px;border-radius:99px;background:#F1ECFB;margin:12px 0 8px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--lemon) 55%,var(--mint));transition:width 1s}
.pbar em{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:3px;font-style:normal}
.pbar em::after{content:"及格 60";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap}
.pred p{font-size:12.5px;color:var(--ink2);line-height:1.55}

/* ---------- 闪卡 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;background:#fff;
  color:var(--ink2);box-shadow:0 3px 0 #E8E1F6;cursor:pointer}
.fchip.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #120B24}
.fc-meta{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.fc-meta b{color:var(--ink)}
.deck{position:relative;height:360px;margin:6px 0 22px;perspective:1300px}
.fcard{position:absolute;inset:0;border-radius:26px}
.fcard.b1{transform:translateY(14px) scale(.95);background:#E3DBFF;box-shadow:0 10px 0 -4px #D5CAFF}
.fcard.b2{transform:translateY(26px) scale(.9);background:#D6CBFF}
.fcard.top{touch-action:pan-y;cursor:grab;transition:transform .32s cubic-bezier(.2,.9,.3,1.2),opacity .3s;z-index:2}
.fcard.top.in{animation:cardIn .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{transform:translateY(14px) scale(.95)}to{transform:none}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.fcard.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;padding:22px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;overflow:hidden}
.face.front{background:#fff;box-shadow:0 18px 34px -20px rgba(91,66,224,.6)}
.face.front::before{content:"";position:absolute;right:-40px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:var(--vio-l)}
.face.back{background:var(--ink);color:#fff;transform:rotateY(180deg);box-shadow:0 18px 34px -20px rgba(42,31,69,.8)}
.fq{position:relative;font-size:24px;font-weight:900;line-height:1.45;margin:16px 0 auto}
.fhint{position:relative;font-size:13px;color:var(--ink3);font-weight:700}
.fa{font-size:21px;font-weight:900;line-height:1.55;margin:6px 0 auto;color:#FFE07A}
.fa-l{font-size:12.5px;font-weight:800;color:#B9AEDA}
.fm{font-size:14px;line-height:1.6;color:#DCD4F5;border-top:1px dashed rgba(255,255,255,.25);padding-top:10px}
.stamp{position:absolute;top:26px;padding:4px 12px;border:3px solid;border-radius:12px;font-size:20px;font-weight:900;
  opacity:0;transform:rotate(-12deg);z-index:3;pointer-events:none;background:rgba(255,255,255,.9)}
.stamp.s-ok{left:18px;color:var(--mint);border-color:var(--mint)}
.stamp.s-no{right:18px;color:#D19300;border-color:var(--lemon);transform:rotate(12deg)}
.fc-act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fc-done{text-align:center;padding:26px 10px}
.fc-done .mascot{margin:0 auto 10px}
.fc-done h2{font-size:22px;font-weight:900;margin-bottom:6px}
.fc-done .row{display:flex;gap:10px;justify-content:center;margin-top:18px}

/* ---------- 闪电战 ---------- */
.bz-hero{display:flex;align-items:center;gap:12px;background:var(--lemon-l);border-radius:22px;padding:14px 16px;margin-top:4px}
.bz-hero p{font-weight:800;font-size:15px;line-height:1.5}
.bz-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.bz-stats div{background:#fff;border-radius:18px;padding:11px 8px;text-align:center;box-shadow:0 3px 0 #E8E1F6}
.bz-stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.bz-stats span{font-size:12px;color:var(--ink2);font-weight:700}
.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 18px}
.dayb{border:0;background:#fff;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 3px 0 #E8E1F6;cursor:pointer}
.dayb:active{transform:translateY(3px);box-shadow:none}
.dayb b{display:block;font-size:15px;font-weight:900}
.dayb span{font-size:12px;color:var(--ink2);font-weight:700}
.dots{display:flex;gap:5px;margin:2px 0 12px}
.dots i{flex:1;height:7px;border-radius:9px;background:#E7E0F6}
.dots i.ok{background:var(--mint)}
.dots i.bad{background:var(--coral)}
.dots i.cur{background:var(--vio)}
.combo{display:inline-flex;align-items:center;gap:4px;background:var(--lemon);color:var(--ink);border-radius:999px;
  padding:5px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--lemon-d)}
.combo.pop{animation:pop .35s ease}
.timer{height:8px;border-radius:9px;background:#EDE7FA;overflow:hidden;margin-bottom:14px;position:relative}
.timer i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px;background:var(--lemon);transform-origin:left}
.timer i.run{animation:drain 20s linear forwards}
@keyframes drain{0%{transform:scaleX(1);background:var(--lemon)}49%{background:var(--lemon)}50%{background:#CFC7E3}100%{transform:scaleX(0);background:#CFC7E3}}
.timer-l{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink3);margin:-8px 0 12px}
.qcard{background:#fff;border-radius:24px;padding:18px 16px 12px;box-shadow:0 14px 28px -20px rgba(91,66,224,.55)}
.qcard .qs{font-size:18.5px;font-weight:800;line-height:1.62;margin:10px 0 14px}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:2px solid #EEE8FA;background:#FBFAFF;border-radius:16px;
  padding:10px 12px;margin-bottom:9px;text-align:left;cursor:pointer;font-size:16px;line-height:1.5;transition:border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.bub{position:relative;flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid #BDB3D6;display:grid;place-items:center;overflow:hidden;background:#fff}
.bub b{position:relative;z-index:1;font-weight:900;font-size:15px;color:var(--ink2)}
.bub::after{content:"";position:absolute;inset:-2px;border-radius:50%;transform:scale(0);
  background:repeating-linear-gradient(-38deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.14) 3px 4px),var(--fill,var(--ink))}
.opt.picked .bub::after{animation:fill .3s ease-out forwards}
.opt.picked .bub b{color:#fff;transition:color .15s .12s}
@keyframes fill{0%{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.1) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.opt.ok{--fill:var(--mint);border-color:var(--mint);background:var(--mint-l)}
.opt.ok .bub{border-color:var(--mint)}
.opt.bad{--fill:var(--coral);border-color:var(--coral);background:var(--coral-l)}
.opt.bad .bub{border-color:var(--coral)}
.opt.right{border-color:var(--mint);background:var(--mint-l);animation:pulse .7s ease 2}
.opt.right .bub{border-color:var(--mint)}
.opt.right .bub b{color:var(--mint-d)}
.opt.ink{--fill:var(--ink);border-color:#CFC5EA;background:#F4F0FF}
.opt.ink .bub{border-color:var(--ink)}
.opt[disabled]{cursor:default}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

const D={"cards":[["绪论","马克思主义的三个基本组成部分","马克思主义哲学、政治经济学、科学社会主义","2025 年卷换了个问法：三者共同构成马克思主义理论体系的「主体内容」。"],["绪论","马克思主义公开问世的标志","1848 年《共产党宣言》发表","它同时是科学社会主义的第一个纲领性文件。"],["绪论","马克思主义的三大直接理论来源","德国古典哲学、英国古典政治经济学、英法空想社会主义","别和三大自然科学前提（细胞学说、能量守恒与转化、进化论）混。"],["绪论","马克思一生的两大发现","唯物史观和剩余价值学说","正是这两大发现，使社会主义从空想变成科学。"],["绪论","马克思主义的基本特征","科学性、人民性、实践性、发展性","一句话概括：科学性与革命性的统一。2025 年 10 月简答第 26 题。"],["绪论","马克思主义的革命性集中表现在","彻底的批判精神和鲜明的政治立场","选项里的「理论体系」「逻辑结构」是干扰项。"],["绪论","学习马克思主义的根本方法","理论联系实际","看到「根本方法」就选它。"],["唯物论","列宁的物质定义","物质是标志客观实在的哲学范畴","核心四个字：客观实在。"],["唯物论","物质的唯一特性","客观实在性","它是自然存在和社会存在的共同特性。"],["唯物论","意识的本质","意识是客观世界的主观映象","「人脑的产物」「物质的产物」只说了意识从哪来，没说它是什么。"],["唯物论","把意识说成「人脑的分泌物」","庸俗唯物主义","把精神直接等同于物质。"],["唯物论","世界的统一性问题，回答的是","万事万物有没有共同本质","唯物主义的回答：世界统一于物质。2026 年 4 月第 5 题。"],["唯物论","划分唯物主义和唯心主义的依据","物质和意识谁是本原","有没有同一性，划分的是可知论和不可知论。"],["唯物论","时间的一维性指","不可逆性","一去不返，只有一个方向。"],["辩证法","唯物辩证法的总观点和总特征","联系的观点和发展的观点","「总」字对应联系和发展。"],["辩证法","唯物辩证法的实质和核心","对立统一规律","「实质」「核心」对应对立统一，别和总特征对调。"],["辩证法","三大规律各揭示什么","对立统一：动力和源泉\n质量互变：状态和形式\n否定之否定：趋势和道路","动力、状态、趋势，一次背完。"],["辩证法","联系有哪些特点","客观性、普遍性、多样性、条件性","「整个世界是相互联系的统一整体」对应普遍性。2026 年 4 月第 6 题。"],["辩证法","「矛盾无处不在，矛盾无时不有」说的是","矛盾的普遍性","各有其特点，说的才是特殊性。"],["辩证法","马克思主义的活的灵魂","具体问题具体分析","也是分析矛盾特殊性的方法论要求。"],["辩证法","反映过去、现在和将来关系的范畴","现实和可能","本质和现象管深浅，原因和结果管前后。"],["辩证法","「世界怎样存在」划分的两种观点","辩证法和形而上学","「世界是什么」划分的是唯物论和唯心论。"],["辩证法","两点论和重点论怎样统一","两点是有重点的两点，重点是两点中的重点","2026 年 4 月论述第 31 题的核心句。"],["认识论","辩证唯物主义认识论：认识的本质","主体在实践基础上对客体的能动反映","两个关键词：实践基础、能动反映。"],["认识论","旧唯物主义认识论的两个缺陷","离开实践考察认识问题；离开辩证法考察认识问题","所以它只是消极的直观反映。2026 年 4 月第 7 题。"],["认识论","感性认识的三种形式","感觉 → 知觉 → 表象","都带着感官的味道。"],["认识论","理性认识的三种形式","概念 → 判断 → 推理","都是脑子里想出来的。2026 年 4 月第 8 题。"],["认识论","夸大感性认识 / 夸大理性认识","经验主义 / 教条主义","方向别搞反。"],["认识论","实践是检验真理唯一标准的原因","实践具有直接现实性","其他说法没错，但答非所问。"],["认识论","真理是什么","对客观事物及其规律的正确反映","真理是认识，不是规律本身。2026 年 4 月第 9 题。"],["认识论","真理和谬误的关系","既对立又统一，在一定条件下相互转化","在批判谬误中发展真理。2025 年 10 月简答第 27 题。"],["认识论","马克思主义哲学的精髓、党的思想路线的核心","实事求是","「精髓」「核心」都指向它。"],["唯物史观","社会历史观的基本问题","社会存在和社会意识的关系问题","哲学基本问题在社会领域的表现。"],["唯物史观","社会存在包括","物质资料生产方式、地理环境、人口因素","带「思想」二字的都属于社会意识。"],["唯物史观","对社会发展起决定作用的是","物质资料的生产方式","地理环境和人口只能影响、制约。2026 年 4 月第 10 题。"],["唯物史观","社会意识相对独立性的突出表现","对社会存在的能动反作用","另外两条：不完全同步性和不平衡性；历史继承性。"],["唯物史观","社会形态是什么的统一","经济基础和上层建筑的统一","「生产力和生产关系」是另一对，是陷阱。"],["唯物史观","整个上层建筑中居主导地位的","政治上层建筑","它的核心是国家政权。2026 年 4 月第 11 题。"],["唯物史观","衡量生产力水平的客观尺度","生产工具","最活跃的因素是劳动者，两个「最」别对调。"],["唯物史观","社会历史发展的基本动力","社会基本矛盾","阶级斗争、改革、科技革命都是动力，但不是「基本」动力。"],["唯物史观","承认必然性又承认主体选择","历史唯物主义","只认必然、否认选择是机械决定论。2026 年 4 月第 12 题。"],["政经","商品二因素和劳动二重性怎样对应","具体劳动创造使用价值\n抽象劳动形成价值","「创造」配使用价值，「形成」配价值。"],["政经","属于商品自然属性的因素","使用价值","价值是社会属性，反映人与人的关系。"],["政经","私有制商品经济的基本矛盾","私人劳动和社会劳动的矛盾","「二重性」是具体和抽象劳动，别混。"],["政经","价值量由什么决定？与劳动生产率什么关系","社会必要劳动时间决定；与劳动生产率成反比","与社会必要劳动时间成正比。"],["政经","货币最基本的两个职能","价值尺度和流通手段","其余三个是派生的。"],["政经","货币转化为资本的前提","劳动力成为商品","剩余价值理论的入口。"],["政经","资本主义生产方式的绝对规律","剩余价值规律","2026 年 4 月第 17 题。"],["政经","三种剩余价值怎样区分","延长工作日：绝对\n社会劳动生产率提高：相对\n个别企业效率更高：超额","关键看是「社会」还是「个别」。"],["政经","不变/可变资本、固定/流动资本的划分依据","前者按在价值增殖中的作用；后者按价值周转方式","同一台机器既是不变资本，又是固定资本。"],["政经","产业资本顺利循环的两个条件","三种职能形式空间上并存、时间上继起","空间并存，时间继起，别写反。2025 年 10 月简答第 28 题。"],["政经","生产价格等于","成本价格＋平均利润","它是商品价值的转化形式。"],["政经","平均利润率的分母","社会预付总资本","分母是可变资本的，是剩余价值率。"],["政经","经济危机周期的必经和基本阶段","危机阶段","四阶段：危机、萧条、复苏、高涨。"],["垄断","私人垄断资本主义形成的基础","生产集中和资本集中","「市场集中」「技术集中」都是干扰项。"],["垄断","垄断组织从松到紧","短期价格协定 → 卡特尔 → 辛迪加 → 托拉斯 → 康采恩 → 混合联合公司","最简单、最初级的是短期价格协定。"],["垄断","垄断利润的主要实现形式","垄断价格","卖时抬价，买时压价。"],["垄断","金融寡头怎样控制经济和国家","经济：参与制\n国家机器：同政府的「个人联合」","两个最容易对调。"],["垄断","资本输出按主体分、按形式分","主体：私人资本输出和国家资本输出\n形式：借贷资本输出和生产资本输出","2026 年 4 月第 22 题问的是主体。"],["垄断","二战后居主导地位的所有制形式","法人资本所有制","2025 年 10 月第 21 题。"],["垄断","经济全球化的主要表现","生产全球化、贸易全球化、金融全球化","只有三个。2025 年 10 月简答第 29 题。"],["科社","无产阶级夺取政权的第一次伟大尝试","巴黎公社","1871 年。尝试不等于成功。"],["科社","世界上第一个社会主义国家","苏维埃俄国","1917 年十月革命建立。"],["科社","展望未来社会：马克思主义与空想社会主义的根本区别","是否坚持科学的立场观点方法","马克思主义只揭示一般特征，不描绘细节。"],["科社","社会主义国家的最高政治领导力量","共产党","选项里的「社会党」是干扰项。"],["科社","最高理想和共同理想","最高理想：实现共产主义\n现阶段共同理想：建设中国特色社会主义","看到「最高」就是共产主义。"],["科社","共产主义社会的根本特征","实现人的自由而全面的发展","其余特征都对，但「根本」只有这一个。"],["科社","实现阶级消灭和国家消亡的社会","共产主义社会","社会主义阶段国家还存在。"],["科社","社会主义道路多样性的三条核心原因","生产力发展水平不同；历史文化传统不同；时代条件和国际环境不同","2026 年 4 月简答第 30 题。"]],"sq":[{"id":"a26","paper":"2025年10月","no":26,"type":"sa","max":6,"stem":"简述马克思主义的基本特征。","points":["科学性","人民性","实践性","发展性","科学性与革命性的统一"],"dis":["阶级性","民族性"],"full":"马克思主义具有鲜明的[[科学性]]、[[人民性]]、[[实践性]]、[[发展性]]，这些特征体现了马克思主义的本质和使命，也展现出马克思主义的理论形象。马克思主义的基本特征，用一句话来概括就是[[科学性与革命性的统一]]。","src":"参考答案，教材 P13","tip":"四个「性」背熟，最后补一句总括「科学性与革命性的统一」。"},{"id":"a27","paper":"2025年10月","no":27,"type":"sa","max":6,"stem":"如何理解真理和谬误的关系？","points":["既对立又统一","确定范围内对立是绝对的","真理可转化为谬误","谬误可转化为真理","在批判谬误中发展真理"],"dis":["真理与谬误没有界限","谬误永远不会变成真理"],"full":"它们之间[[既对立又统一]]。（1）二者相互对立。在确定的对象和范围内，真理与谬误的[[对立是绝对的]]，与对象相符合的认识就是真理，与对象不相符合的认识就是谬误。（2）二者的对立又是相对的，它们[[在一定条件下能够相互转化]]。①[[真理在一定条件下会转化为谬误]]：任何真理都只在一定范围内、一定条件下才能成立，超出这个范围，失去特定条件，就会变成谬误。②[[谬误在一定条件下能够向真理转化]]：勇于正视、反省、修正错误，终能让谬误转化为真理。③[[在批判谬误中发展真理]]，是谬误向真理转化的另一种形式。","src":"参考答案，教材 P98","tip":"先下结论「既对立又统一」，再分「对立」「转化」两层写，转化那层有三小点。"},{"id":"a28","paper":"2025年10月","no":28,"type":"sa","max":6,"stem":"简述产业资本的运动中，实现资本顺利循环必须具备的两个基本前提条件。","points":["三种职能形式在空间上并存","三种职能形式在时间上继起","按比例同时存在于三种形式","转化保持时间上的依次连续"],"dis":["三种职能形式在时间上并存","三种职能形式在空间上继起"],"full":"产业资本的运动，必须具备两个基本前提条件：一是产业资本的三种职能形式必须[[在空间上并存]]，也就是说，产业资本必须[[按照一定比例同时存在]]于货币资本、生产资本和商品资本三种形式中。二是产业资本的三种职能形式必须[[在时间上继起]]，也就是说，产业资本循环中三种职能形式的转化必须保持[[时间上的依次连续性]]。","src":"参考答案，教材 P220","tip":"口诀：空间并存，时间继起。最常见的丢分是把「空间」「时间」写反。"},{"id":"a29","paper":"2025年10月","no":29,"type":"sa","max":6,"stem":"经济全球化的内涵和主要表现是什么？","points":["各国经济相互联系、相互依赖的过程","生产全球化","贸易全球化","金融全球化"],"dis":["文化全球化","政治全球化"],"full":"（1）内涵：经济全球化是指在生产不断发展、科技加速进步、社会分工和国际分工不断深化、生产的社会化和国际化程度不断提高的情况下，世界各国、各地区的经济活动[[越来越超出一国和地区的范围]]而[[相互联系、相互依赖的过程]]。（2）主要表现：①[[生产全球化]]；②[[贸易全球化]]；③[[金融全球化]]。","src":"参考答案，教材 P256—P258","tip":"表现只有三个：生产、贸易、金融。内涵那句长，至少写出「超出一国范围、相互联系相互依赖的过程」。"},{"id":"a30","paper":"2025年10月","no":30,"type":"sa","max":6,"stem":"简述马克思主义经典作家预见未来社会的方法论原则。","points":["揭示社会发展一般规律，指明方向","剖析旧世界中阐发新世界特点","在社会主义发展中深化认识","只揭示一般特征，不描绘细节"],"dis":["详细设计未来社会的蓝图","从理性原则出发构想理想社会"],"full":"（1）在[[揭示人类社会发展一般规律]]的基础上指明社会发展的方向。（2）在[[剖析资本主义旧世界]]的过程中阐发未来新世界的特点。（3）在[[社会主义社会发展中不断深化]]对未来共产主义社会的认识。（4）立足于[[揭示未来社会的一般特征]]，而[[不对各种细节作具体描绘]]。","src":"参考答案，教材 P329","tip":"第四条是马克思主义和空想社会主义的分水岭，2026 年 4 月第 24 题选择题也考了它。"},{"id":"a31","paper":"2025年10月","no":31,"type":"lun","max":10,"stem":"试述矛盾的普遍性、矛盾的特殊性的含义以及分析矛盾的特殊性的意义。","points":["普遍性：无处不在、无时不有","特殊性：各有其特点","分析特殊性就是具体问题具体分析","是正确认识事物的基础","是正确解决矛盾的关键","马克思主义的活的灵魂"],"dis":["用一种方法解决一切矛盾","特殊性就是偶然性"],"full":"（1）[[矛盾的普遍性]]是指矛盾存在于一切事物中，存在于一切事物发展过程的始终，旧的矛盾解决了，又产生新的矛盾，事物始终在矛盾中运动。「[[矛盾无处不在，矛盾无时不有]]」就是对矛盾普遍性的形象表述。[[矛盾的特殊性]]是指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上[[各有其特点]]。矛盾的特殊性决定了事物的不同性质。\n（2）分析矛盾的特殊性就是坚持[[具体问题具体分析]]。一方面，分析矛盾的特殊性是[[正确认识事物的基础]]，只有这样才能把不同的事物区别开来。另一方面，分析矛盾的特殊性是[[正确解决矛盾的关键]]，不同的矛盾只能用不同的方法解决，即「一把钥匙开一把锁」。因此，具体问题具体分析是[[马克思主义的活的灵魂]]。","src":"参考答案","tip":"两段式：先写两个含义，再写意义。「基础」「关键」「活的灵魂」三个词一个都别漏。"},{"id":"a32","paper":"2025年10月","no":32,"type":"lun","max":10,"stem":"什么是社会意识？如何理解社会意识相对独立性的含义及表现？","points":["社会存在的反映、社会生活的精神方面","受社会存在决定，又有自身发展规律","不完全同步性和不平衡性","内部相互影响且有历史继承性","能动的反作用（突出表现）"],"dis":["社会意识决定社会存在","与社会存在完全同步变化"],"full":"（1）社会意识的含义：社会意识是[[社会存在的反映]]，是[[社会生活的精神方面]]。\n（2）相对独立性的含义：社会意识在从根本上[[受到社会存在决定]]的同时，还具有[[自身特有的发展形式和发展规律]]。\n（3）相对独立性的表现：①社会意识与社会存在发展具有[[不完全同步性和不平衡性]]；②社会意识内部各种形式之间[[存在相互影响且各自具有历史继承性]]；③社会意识对社会存在具有[[能动的反作用]]，这是社会意识相对独立性的[[突出表现]]。","src":"参考答案，教材 P129、P133","tip":"三层：是什么、相对独立性是什么、表现有哪些。「反作用」是突出表现，一定写。"},{"id":"a33","paper":"2025年10月","no":33,"type":"lun","max":10,"stem":"试述资本主义为社会主义所代替的历史必然性。","points":["基本矛盾包含一切冲突的萌芽","资本积累推动矛盾激化","国家垄断资本主义是社会主义的前奏","两大阶级的矛盾和斗争"],"dis":["资本主义可以自我完善","战后新变化改变了资本主义本质"],"full":"[[资本主义的内在矛盾]]决定了资本主义必然被社会主义所代替。（1）资本主义[[基本矛盾]]（生产社会化和生产资料资本主义私人占有之间的矛盾）「[[包含着现代的一切冲突的萌芽]]」。（2）[[资本积累]]推动资本主义基本矛盾不断激化并最终否定资本主义自身。（3）[[国家垄断资本主义]]是资本社会化的更高形式，将成为[[社会主义的前奏]]。（4）资本主义社会存在着[[资产阶级和无产阶级两大阶级]]之间的矛盾和斗争。","src":"参考答案，教材 P278","tip":"开头一句总论，下面四点。第 3 点的「前奏」最容易漏。"},{"id":"b26","paper":"2026年4月","no":26,"type":"sa","max":6,"stem":"什么是价值观？我国社会主义核心价值观的基本内容是什么？","points":["关于价值的根本观点和评价标准","富强、民主、文明、和谐","自由、平等、公正、法治","爱国、敬业、诚信、友善"],"dis":["勤劳、节俭、孝顺、谦让","团结、奋斗、创新、奉献"],"full":"价值观是人们[[关于价值的根本观点和评价标准]]。社会主义核心价值观的基本内容：国家层面——[[富强、民主、文明、和谐]]；社会层面——[[自由、平等、公正、法治]]；公民层面——[[爱国、敬业、诚信、友善]]。","src":"资料参考答案","tip":"十二个词按国家、社会、公民三层记，每层四个。"},{"id":"b27","paper":"2026年4月","no":27,"type":"sa","max":6,"stem":"简要说明社会存在与社会意识的含义及相互关系。","points":["社会存在：社会生活的物质方面","社会意识：社会生活的精神方面","社会存在决定社会意识","社会意识有相对独立性并反作用于社会存在"],"dis":["社会意识决定社会存在","二者互不影响、各自发展"],"full":"[[社会存在]]是[[社会生活的物质方面]]，包括物质资料生产方式、地理环境、人口因素。[[社会意识]]是[[社会生活的精神方面]]，包括社会心理和思想体系。相互关系：①[[社会存在决定社会意识]]；②社会意识对社会存在具有[[相对独立性]]，并能[[反作用于社会存在]]。","src":"资料参考答案","tip":"含义各一句；关系必须写两条，决定加反作用，只写「决定」会丢分。"},{"id":"b28","paper":"2026年4月","no":28,"type":"sa","max":6,"stem":"简述生产价格的形成过程。","points":["剩余价值转化为利润","利润转化为平均利润","成本价格＋平均利润＝生产价格","生产价格是商品价值的转化形式"],"dis":["价格转化为价值","平均利润转化为剩余价值"],"full":"①[[剩余价值转化为利润]]；②[[利润转化为平均利润]]；③[[成本价格与平均利润之和构成生产价格]]；④生产价格是[[商品价值的转化形式]]。","src":"资料参考答案","tip":"一条转化链，按顺序写：剩余价值 → 利润 → 平均利润 → 生产价格。"},{"id":"b29","paper":"2026年4月","no":29,"type":"sa","max":6,"stem":"第二次世界大战后资本主义发生了一系列新变化，其主要表现有哪些？这是否意味着资本主义本质的改变？","points":["生产资料所有制的变化","劳资关系和分配关系的变化","社会阶层和阶级结构的变化","经济调节机制和经济危机形态的变化","政治制度的变化","没有改变资本主义的本质"],"dis":["资本主义私有制已经消失","剥削关系已经不存在"],"full":"主要表现：①[[生产资料所有制的变化]]（国家资本所有制、法人资本所有制发展）；②[[劳资关系和分配关系的变化]]（职工参与决策、福利制度等）；③[[社会阶层和阶级结构的变化]]；④[[经济调节机制和经济危机形态的变化]]；⑤[[政治制度的变化]]。这些变化是在资本主义制度框架内的调整，[[没有改变资本主义的本质]]：私有制和剥削关系依然存在，[[基本矛盾没有消除]]。","src":"按教材章节整理（资料答案较简略）","tip":"先答「有哪些变化」，再答「是否改变本质」。第二问的结论必须写：没有改变。"},{"id":"b30","paper":"2026年4月","no":30,"type":"sa","max":6,"stem":"简述社会主义发展道路多样性的原因。","points":["各国生产力发展水平不同","历史文化传统不同","时代条件和国际环境不同","人民群众实践探索的创造性"],"dis":["社会主义的本质各不相同","马克思主义基本原理已经过时"],"full":"①各国[[生产力发展水平]]和经济社会发展状况不同；②[[历史文化传统]]存在差异；③所处的[[时代条件与国际环境]]不同；④[[人民群众的实践探索]]具有创造性；⑤马克思主义基本原理与各国实际[[相结合的路径]]不同。","src":"资料参考答案","tip":"前三条（生产力水平、历史文化、时代与国际环境）是核心，一定写；后两条有时间再补。"},{"id":"b31","paper":"2026年4月","no":31,"type":"lun","max":10,"stem":"把主要矛盾和次要矛盾、矛盾的主要方面和次要方面的辩证关系运用到实际工作中，就是要坚持「两点论」和「重点论」的统一。试述「两点论」和「重点论」统一的原理及其现实意义。","points":["两点论：兼顾主次矛盾和主次方面","重点论：着重把握主要矛盾和主要方面","两点是有重点的两点，重点是两点中的重点","正确认识和解决社会主要矛盾","工作中抓住关键环节","反对均衡论和一点论"],"dis":["只抓主要矛盾，其余不管","各方面平均用力"],"full":"原理：「[[两点论]]」是指看问题要[[兼顾主要矛盾和次要矛盾、矛盾的主要方面和次要方面]]；「[[重点论]]」是指在兼顾两点的前提下，[[着重把握主要矛盾和矛盾的主要方面]]；二者统一：[[两点是有重点的两点，重点是两点中的重点]]。\n现实意义：①正确认识和解决[[社会主要矛盾]]（如新时代人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾）；②指导经济、政治、文化等各领域工作，[[抓住关键环节]]；③[[反对均衡论和一点论]]，提高辩证思维能力；④在复杂局面中清醒判断主次，科学决策。","src":"资料参考答案","tip":"原理三句加意义三句，正好是论述题的两段式。"},{"id":"b32","paper":"2026年4月","no":32,"type":"lun","max":10,"stem":"试述商品经济中商品价值量的决定及其与劳动生产率的关系。","points":["由社会必要劳动时间决定","正常生产条件、平均熟练程度和劳动强度","单位商品价值量与劳动生产率成反比","单位时间创造的价值总量不变"],"dis":["价值量与劳动生产率成正比","价值量由个别劳动时间决定"],"full":"价值量的决定：商品的价值量由生产商品的[[社会必要劳动时间]]决定。社会必要劳动时间是在[[现有的社会正常的生产条件]]下，在[[社会平均的劳动熟练程度和劳动强度]]下，制造某种使用价值所需要的劳动时间。\n与劳动生产率的关系：①劳动生产率越高，[[单位商品的价值量越小]]，二者[[成反比]]；②单位时间内生产的使用价值量增加，但[[创造的价值总量不变]]；③个别企业提高劳动生产率可以获得超额剩余价值；④社会劳动生产率普遍提高，会使单位商品价值量下降。","src":"资料参考答案","tip":"第一段写清「社会必要劳动时间」的定义，第二段一句「成反比」再加解释。"},{"id":"b33","paper":"2026年4月","no":33,"type":"lun","max":10,"stem":"如何理解资本主义的历史进步性？其主要表现是什么？","points":["取代封建主义是历史的巨大进步","生产力空前发展","促进世界市场形成与经济全球化","推动民主法治等政治文明进步","为社会主义准备物质条件和社会力量"],"dis":["彻底消灭了剥削","实现了人的全面发展"],"full":"历史进步性：资本主义[[取代封建主义是历史的巨大进步]]。主要表现：①[[生产力空前发展]]：机械化、工业化、科技革命；②促进了[[世界市场的形成与经济全球化]]；③推动了[[民主、法治、自由等政治文明进步]]；④打破了封建等级制度，在一定程度上促进了人的解放；⑤为社会主义的产生准备了[[物质条件和社会力量]]（无产阶级）。","src":"资料参考答案","tip":"先一句定性，再列表现。最后一条「为社会主义准备条件」是点睛，别漏。"}],"e2025":[{"q":"在马克思主义理论体系中，马克思主义哲学、马克思主义政治经济学和科学社会主义共同构成其","o":["基本内涵","主要特征","根本性质","主体内容"],"a":3,"w":"马克思主义理论体系的主体内容由马克思主义哲学、马克思主义政治经济学和科学社会主义三部分构成。三者相互联系、有机统一，共同支撑起马克思主义的理论框架。","p":"P2"},{"q":"下列选项属于为马克思主义的创立提供了直接理论来源的是","o":["古希腊罗马哲学","文艺复兴运动的思想成果","德国古典哲学","法国复辟时期历史学家的进步思想"],"a":2,"w":"马克思主义的直接理论来源包括德国古典哲学、英国古典政治经济学和英法两国的空想社会主义。德国古典哲学（以黑格尔辩证法和费尔巴哈唯物主义为代表）为马克思主义哲学的创立提供了重要理论借鉴。","p":"P5"},{"q":"唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于","o":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"a":2,"w":"唯物主义和唯心主义的根本分歧在于对物质和意识谁是世界本源问题的不同回答。唯物主义认为物质是本原，唯心主义认为意识是本原。","p":"P26"},{"q":"客观实在性作为物质的唯一特性，体现的是","o":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"a":3,"w":"物质的唯一特性是客观实在性，这一特性既适用于自然领域的存在（如山川河流），也适用于社会领域的存在（如生产方式、社会关系），是二者的共同特性。","p":"P28-P29"},{"q":"马克思指出：“观念的东西不外是移入人脑并在人的头脑中改造过的物质的东西而已。”这就是说","o":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"a":1,"w":"马克思的这句话表明，意识的内容来源于客观物质世界，是人脑对客观事物的主观反映。意识并非人脑凭空产生，而是对物质的能动改造后的结果，既不是人脑的分泌物（庸俗唯物主义观点），也不是虚幻影像。","p":"P33"},{"q":"在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是","o":["内容和形式","本质和现象","原因和结果","现实和可能"],"a":3,"w":"现实范畴反映事物当下的实际存在状态，可能范畴反映事物未来发展的潜在趋势，二者揭示了事物过去、现在与将来的联系。内容与形式反映事物的构成与表现方式，本质与现象反映事物的内在联系与外在表现，原因与结果反映事物的前后相继、引起与被引起关系。","p":"P54"},{"q":"“认识的本质是主体在实践基础上对客体的能动反映”，这是一种","o":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"a":2,"w":"辩证唯物主义认识论认为，认识的本质是主体在实践基础上对客体的能动反映，既强调实践的决定性作用，又承认认识的能动性。主观唯心主义认识论否认客观客体的存在，客观唯心主义认识论将认识归结为对绝对精神的把握，旧唯物主义认识论否认认识的能动性。","p":"P81-P82"},{"q":"轻视理性认识而片面夸大感性认识的作用，会导致实践中的","o":["实用主义","怀疑主义","教条主义","经验主义"],"a":3,"w":"经验主义片面夸大感性认识的作用，轻视理性认识的指导意义，认为只有感性经验才是可靠的认识来源。实用主义强调认识的实际效用，怀疑主义否认认识的可能性，教条主义片面夸大理性认识的作用，轻视感性经验。","p":"P87"},{"q":"实践是检验真理的唯一标准，这是因为","o":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],"a":3,"w":"实践之所以是检验真理的唯一标准，核心在于实践具有直接现实性——它能将主观认识转化为客观现实，通过实际结果验证认识是否符合客观规律。其他选项虽表述正确，但并非这一命题的根本原因。","p":"P101"},{"q":"中国共产党的思想路线的核心是","o":["自信自立","守正创新","实事求是","自我革命"],"a":2,"w":"中国共产党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。其中，实事求是是思想路线的核心。","p":"P117"},{"q":"社会历史观的基本问题是","o":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"a":0,"w":"社会存在与社会意识的关系问题，是社会历史观的基本问题。正确认识社会存在与社会意识的关系，是科学把握人类社会发展规律的基础和前提。","p":"P126"},{"q":"社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是","o":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"a":1,"w":"社会存在包括自然地理环境、人口因素和物质生产方式（生产力与生产关系的统一）。政治法律思想属于社会意识的范畴，是上层建筑的重要组成部分。","p":"P127"},{"q":"下列各项正确说明经济基础与上层建筑的关系的是","o":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"a":0,"w":"经济基础与上层建筑的关系中，经济基础处于决定地位：经济基础的性质决定上层建筑的性质，经济基础的变化发展决定上层建筑的变化发展。上层建筑具有相对独立性，并非与经济基础同步变化，也不能决定经济基础。","p":"P142"},{"q":"从商品二因素与劳动二重性的关系考察商品经济中能够形成商品价值的劳动是","o":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"a":2,"w":"商品二因素（使用价值和价值）对应劳动二重性（具体劳动和抽象劳动）。具体劳动创造商品的使用价值，抽象劳动（无差别的人类一般劳动）形成商品的价值。","p":"P189"},{"q":"下列关于商品价值量决定关系的表述中，正确的是","o":["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],"a":0,"w":"商品的价值量由社会必要劳动时间决定，二者成正比——社会必要劳动时间越长，价值量越大。劳动生产率（单位时间内生产的商品数量）与价值量成反比——劳动生产率越高，单位商品耗费的社会必要劳动时间越少，价值量越小。","p":"P190"},{"q":"资本主义社会中，劳动力成为商品要具备的基础条件，不包括","o":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"a":1,"w":"劳动力成为商品的两个基本条件：一是劳动者在法律上是自由人，能自主支配自己的劳动力；二是劳动者没有任何生产资料和生活资料，只能靠出卖劳动力为生。劳动者人身依附于资本家是封建制生产关系的特征，并非劳动力成为商品的条件。","p":"P208"},{"q":"资本主义社会经济危机会周期性爆发，但现实中资本主义的再生产周期不一定都要依次经过典型的四个阶段，其中有一个阶段是资本主义经济周期的必经阶段和基本阶段，这个阶段是","o":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"a":0,"w":"资本主义再生产周期包括危机、萧条、复苏、高涨四个阶段，其中危机阶段是必经阶段和基本阶段，是资本主义基本矛盾激化的集中表现，决定了周期的性质和进程。","p":"P228"},{"q":"资本主义国家政权采取分权制衡的组织形式，即三权分立制度，下列选项中不属于这“三权”的是","o":["监督权","司法权","行政权","立法权"],"a":0,"w":"三权分立制度中的“三权”指立法权、行政权和司法权，三者相互独立、相互制衡。监督权并非独立的“三权”之一，而是通过三权之间的制约关系实现的。","p":"P231"},{"q":"垄断资本主义形成于19世纪末20世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为","o":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"a":0,"w":"19世纪末20世纪初形成的垄断资本主义，以私人垄断资本为基础，称为私人垄断资本主义。国家垄断资本主义是二战后发展起来的，指国家政权与私人垄断资本相结合的垄断资本主义。","p":"P241"},{"q":"垄断资本主义国家的垄断组织虽然形式多种多样，但本质都是为了","o":["促进技术进步","获得垄断利润","控制销售市场","增加商品生产"],"a":1,"w":"垄断组织的形式（如卡特尔、辛迪加、托拉斯等）虽各不相同，但本质都是为了获取垄断利润——通过垄断价格（高于或低于生产价格的价格）实现的超额利润，是垄断资本主义的核心目标。","p":"P245"},{"q":"第二次世界大战后，资本主义生产资料所有制发生了新的变化，成为居主导地位的所有制形式是","o":["国家资本所有制","法人资本所有制","员工持股所有制","知识资本所有制"],"a":1,"w":"二战后，资本主义生产资料所有制发生新变化，法人资本所有制逐渐取代私人资本所有制，成为居主导地位的所有制形式。法人资本所有制是指法人股东（如企业法人、金融机构法人）控股的所有制形式。","p":"P262-P263"},{"q":"与通常意义上对金融资本概念的理解和使用不同，马克思主义政治经济学的金融资本概念有其独特内涵，它指的是垄断资本主义国家","o":["银行自有资本和借入资本的总和","银行和非银行金融机构资本的总和","资本市场上流通的所有货币资本的总和","工业垄断资本和银行垄断资本融合形成的垄断资本"],"a":3,"w":"马克思主义政治经济学中的金融资本，特指工业垄断资本和银行垄断资本在竞争中相互融合形成的新型垄断资本，并非泛指所有金融机构的资本或货币资本总和。","p":"P244"},{"q":"无产阶级夺取政权的第一次伟大尝试是","o":["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],"a":1,"w":"1871年的巴黎公社革命，是无产阶级第一次尝试建立自己的国家政权，为无产阶级革命积累了宝贵经验。十月革命是人类历史上第一次胜利的社会主义革命，建立了第一个社会主义国家。","p":"P286"},{"q":"社会主义国家的最高政治领导力量是","o":["工会","社会党","共产党","共青团"],"a":2,"w":"社会主义国家的最高政治领导力量是共产党，这是由社会主义国家的性质和共产党的先进性决定的，是社会主义事业顺利发展的根本保证。","p":"P304"},{"q":"共产主义社会的根本特征是","o":["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],"a":3,"w":"共产主义社会的根本特征是实现人的自由而全面的发展。人与自然和谐共生、精神境界极大提高、社会关系高度和谐都是共产主义社会的重要特征，但并非根本特征。","p":"P339"}],"e2026":[["下列选项属于马克思主义基本组成部分的是",["马克思主义立场、观点和方法","马克思主义自然观、历史观和价值观","马克思主义物质观、实践观和发展观","马克思主义哲学、政治经济学和科学社会主义"],3,"三个基本组成部分：哲学、政治经济学、科学社会主义。其余三项是拼出来的相似组合，不是「组成部分」。"],["作为马克思主义公开问世标志的是",["“正义者同盟”改组","《共产党宣言》发表","欧洲革命爆发","《新莱茵报》创刊"],1,"1848 年《共产党宣言》发表，标志着马克思主义公开问世。"],["下列表述属于列宁的物质定义内容的是",["物质是标志客观实在的哲学范畴","物质与时间具有统一性","物质是与运动不可分割的","物质与空间具有统一性"],0,"定义的核心是「客观实在」。B、C、D 讲的是物质与运动、时空的关系，话没错，但不是定义。"],["下列选项正确揭示意识的本质的是",["意识是人脑的产物","意识是在劳动交往中发展的","意识是物质的产物","意识是客观世界的主观映象"],3,"本质＝客观世界的主观映象。A、C 只讲了意识从哪来，没讲意识是什么。"],["世界的统一性问题，是回答世界上的万事万物",["有没有共同特征的问题","有没有相同结构的问题","有没有共同本质的问题","有没有相同功能的问题"],2,"统一性问题问的是万事万物有没有共同本质。唯物主义的回答：世界统一于物质。"],["任何事物内部的各要素之间、任何事物和其他事物之间都是有联系的，整个世界是相互联系的统一整体。这表明",["联系具有客观性","联系具有普遍性","联系具有多样性","联系具有条件性"],1,"「任何……都有联系」「整个世界是统一整体」＝到处都有＝普遍性。"],["在认识的本质问题上，旧唯物主义认识论的缺陷有二，一个是离开辩证法考察认识问题，另一个是",["离开实践考察认识问题","没有坚持反映论的立场","离开主体考察认识问题","没有坚持先验论的立场"],0,"旧唯物主义两大缺陷：离开实践、离开辩证法，所以只能是消极的直观反映。它坚持了反映论，B 不对。"],["理性认识由低级向高级的发展表现为",["从感觉到知觉再到表象","从观察到联想再到猜测","从概念到判断再到推理","从分析到归纳再到假说"],2,"理性三形式：概念→判断→推理。A 是感性认识的三形式，专门放在这里等你混。"],["下列关于真理的说法中，正确的是",["真理是独立于主体意识的物质实体","真理是思维与它的先验形式相一致","真理是不以人的意志为转移的客观规律","真理是对客观事物及其规律的正确反映"],3,"真理是一种认识，是对规律的正确反映。C 把真理说成规律本身，混淆了认识和认识的对象。"],["对人类社会发展起决定作用的是",["富饶的自然资源","良好的生态环境","适度的人口数量","物质资料的生产方式"],3,"起决定作用的是物质资料的生产方式。自然环境、人口只能影响和制约。"],["在整个上层建筑中，居于主导地位的是",["政治法律思想","政治上层建筑","艺术和宗教","道德和哲学"],1,"政治上层建筑居主导地位，核心是国家政权。A、C、D 属于观念上层建筑。"],["承认社会形态更替的必然性的同时又承认主体选择的作用，这种观点属于",["历史唯心主义","机械决定论","历史唯物主义","诡辩论"],2,"必然性和主体选择都承认，是历史唯物主义。只认必然、否认选择的，是机械决定论。"],["关于个人在历史进程中的作用，唯物史观认为",["每个个体都是历史活动的参与者","历史人物的作用总是促进性的","个人在历史上的作用不存在差别","历史人物的作用不受规律制约"],0,"B、C、D 都带绝对化字眼（总是、不存在、不受），一眼可排除。"],["商品经济得以产生的社会历史条件，除了生产资料和劳动产品属于不同所有者之外，还有一个，即",["存在自然分工","存在社会分工","存在部落内部分工","存在部落间分工"],1,"两个条件：社会分工＋不同所有者。是「社会分工」，不是自然分工。"],["商品二因素中反映人与自然之间的物质关系、属于商品自然属性的因素，是商品的",["使用价值","交换价值","价值","价格"],0,"使用价值＝自然属性＝人与自然；价值＝社会属性＝人与人。"],["以私有制为基础的商品经济的基本矛盾是",["具体劳动和抽象劳动的矛盾","私人劳动和社会劳动的矛盾","个别劳动和一般劳动的矛盾","生产劳动和非生产劳动的矛盾"],1,"基本矛盾＝私人劳动和社会劳动。A 是劳动二重性，被放进来陪跑。"],["资本主义生产方式的绝对规律是",["资本主义的竞争规律","资本积累的一般规律","资本主义再生产周期规律","剩余价值规律"],3,"生产剩余价值是资本主义生产的目的和决定性动机，所以剩余价值规律是它的绝对规律。"],["从资本循环角度看，资本家工厂中已经进入仓库的产成品，属于产业资本循环中的",["货币资本形态","生产资本形态","商品资本形态","固定资本形态"],2,"三形态：货币资本→生产资本→商品资本。做好待卖的东西就是商品资本。D 是另一套分法里的词。"],["19世纪末20世纪初形成的垄断资本主义主要以私人垄断资本为基础。私人垄断资本主义形成的基础是",["生产集中和市场集中","生产集中和资本集中","资本集中和市场集中","技术集中和资本集中"],1,"固定搭配：生产集中和资本集中。"],["垄断是通过一定的垄断组织形式实现的。在一个或几个经济部门中占据垄断地位的大企业联合形成的垄断组织，形式多种多样且不断变化，其中最简单、初级的垄断组织形式是",["短期价格协定","长期价格协定","短期市场协定","长期市场协定"],0,"从松到紧：短期价格协定→卡特尔→辛迪加→托拉斯→康采恩→混合联合公司。最简单的是短期价格协定。"],["资本主义国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节，这种调节形式属于",["法律调节","政治调节","宏观调节","微观调节"],2,"财政政策、货币政策调节总供给和总需求，属于宏观调节。"],["垄断资本形成后会向世界范围扩展。从输出资本的主体来看，主要有",["借贷资本输出和商品资本输出","生产资本输出和商品资本输出","私人资本输出和国家资本输出","生产资本输出和借贷资本输出"],2,"按主体分：私人和国家；按形式分：借贷资本输出和生产资本输出。D 是按形式分的，题干问的是主体。"],["恩格斯在《在马克思墓前的讲话》中指出，马克思一生有两大发现。正是这两大发现为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。这两大发现是",["辩证唯物主义和历史唯物主义","唯物史观和剩余价值学说","劳动价值论和剩余价值学说","唯物论和辩证法"],1,"两大发现：唯物史观和剩余价值学说。"],["在展望未来社会的问题上，马克思主义与空想社会主义的根本区别是",["是否坚持科学的立场观点方法","是否对未来社会做详尽描述","是否反映无产阶级的愿望要求","是否批判了资本主义旧世界"],0,"根本区别在立场观点方法。B 也是二者的不同之处，但只是表现，不是根本。"],["共产党人的最高理想是",["建设社会主义","实现新民主主义","建设中国特色社会主义","实现共产主义"],3,"最高理想＝实现共产主义；现阶段的共同理想＝建设中国特色社会主义。"]],"bank":[{"k":"b-d1-0","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"马克思主义哲学的直接理论来源是","o":["古希腊罗马哲学","德国古典哲学","近代英国哲学","近代法国哲学"],"a":1,"w":"三大直接来源：德国古典哲学、英国古典政治经济学、英法空想社会主义。问哲学来源就选德国古典哲学。","s":"2022年4月·第1题"},{"k":"b-d1-1","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"细胞学说、能量守恒与转化、进化论三大发现，为马克思主义的产生提供了","o":["直接来源","阶级利益","自然科学基础","主观条件"],"a":2,"w":"自然科学三大发现是「自然科学前提」，不是「直接理论来源」。来源是哲学，前提是科学，别混。","s":"2023年4月·第1题"},{"k":"b-d1-2","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"马克思主义产生于19世纪","o":["40年代","50年代","60年代","70年代"],"a":0,"w":"19世纪40年代。记住锚点：1848年《共产党宣言》发表，所以只能是40年代。","s":"2021年10月·第1题"},{"k":"b-d1-3","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"下列各项集中表现马克思主义革命性的是","o":["科学的理论内涵","完备的理论体系","严密的逻辑结构","彻底的批判精神"],"a":3,"w":"革命性＝彻底的批判精神 + 鲜明的政治立场。科学性才讲理论体系、逻辑结构。","s":"2021年10月·第2题"},{"k":"b-d1-4","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"马克思主义的革命性集中表现为它具有彻底的批判精神，还表现为它具有","o":["完整的理论体系","严密的逻辑结构","鲜明的政治立场","崇高的社会理想"],"a":2,"w":"上一题的另一个问法：题干已经给了「批判精神」，要补的就是「鲜明的政治立场」。","s":"2023年10月·第2题"},{"k":"b-d1-5","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"学习马克思主义的根本方法是","o":["理论联系实际","更新思想观念","熟读经典著作","了解党的文献"],"a":0,"w":"「根本方法」四个字只对应理论联系实际，这是固定搭配，简答题也考。","s":"2022年4月·第2题"},{"k":"b-d1-6","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"世界观是人们","o":["对自然界的根本看法和根本观点","对人类社会的根本看法和根本观点","对精神世界的根本看法和根本观点","对整个世界的根本看法和观点"],"a":3,"w":"世界观管的是「整个世界」。A、B、C 都把范围缩小了——这就是典型的缩小范围型干扰项。","s":"2023年4月·第3题"},{"k":"b-d1-7","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"唯物主义和唯心主义是两种根本对立的哲学派别，其形成的原因在于","o":["二者对客观实在性的认识不同","二者对主观能动性的认识不同","二者对物质和意识谁为本源问题的回答不同","二者对思维和存在有否同一性问题的回答不同"],"a":2,"w":"分唯物唯心，看本原问题；分可知论不可知论，看同一性问题。D 是另一道题的答案。","s":"2025年10月·第3题"},{"k":"b-d1-8","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"客观实在性作为物质的唯一特性，体现的是","o":["某种自然存在的个别特性","自然存在和社会存在的不同特性","几种自然存在的共同特性","自然存在和社会存在的共同特性"],"a":3,"w":"「唯一特性」意味着它必须涵盖一切存在——自然的和社会的都算，所以是二者的共同特性。","s":"2025年10月·第4题"},{"k":"b-d1-9","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"马克思指出：“观念的东西不外是移入人脑并在人的头脑中改造过的物质的东西而已。”这就是说","o":["意识是人脑的分泌物","意识是客观世界的主观映象","意识是人脑的附属物","意识是客观世界的虚幻影像"],"a":1,"w":"标准表述就是「客观世界的主观映象」。A 是庸俗唯物主义，D 是唯心主义，都是错的。","s":"2025年10月·第5题"},{"k":"b-d1-10","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"把意识说成是人脑的分泌物，这是一种","o":["庸俗唯物主义的观点","朴素唯物主义的观点","形而上学唯物主义的观点","辩证唯物主义的观点"],"a":0,"w":"「分泌物」把意识当成了物质本身，这是庸俗唯物主义的标志性说法，见到就选它。","s":"2020年10月·第6题"},{"k":"b-d1-11","day":"d1","topic":"绪论与唯物论","cls":"zhe","q":"时间的一维性指的是时间的","o":["绝对性","无限性","持续性","不可逆性"],"a":3,"w":"一维＝只有一个方向＝一去不返＝不可逆性。C「持续性」是时间的另一个含义，不是「一维性」。","s":"2023年10月·第4题"},{"k":"b-d2-0","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"联系的观点和发展的观点是","o":["马克思主义的理论品质","唯物辩证法的总观点和总特征","马克思主义的活的灵魂","唯物辩证法的实质和核心"],"a":1,"w":"总观点、总特征＝联系和发展；实质、核心＝对立统一规律。D 就是等你换错的那个坑。","s":"2023年10月·第5题"},{"k":"b-d2-1","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"唯物辩证法是关于自然、社会和思维联系与发展一般规律的科学。其中，否定之否定规律揭示的是事物发展的","o":["前提和条件","状态和形式","动力和源泉","趋势和道路"],"a":3,"w":"三条口诀：对立统一＝动力和源泉，质量互变＝状态和形式，否定之否定＝趋势和道路。","s":"2022年4月·第5题"},{"k":"b-d2-2","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"“矛盾无处不在，矛盾无时不有。”这句话说的是","o":["矛盾具有特殊性","矛盾具有普遍性","矛盾具有同一性","矛盾具有斗争性"],"a":1,"w":"「无处不在、无时不有」＝到处都有＝普遍性。特殊性讲的是各有各的不同。","s":"2023年4月·第5题"},{"k":"b-d2-3","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"分析矛盾的特殊性就是","o":["坚持“两点论”","坚持理论联系实际","坚持“重点论”","坚持具体问题具体分析"],"a":3,"w":"特殊性对应的方法论固定是「具体问题具体分析」，这是马克思主义活的灵魂。","s":"2021年4月·第5题"},{"k":"b-d2-4","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"在唯物辩证法体系中，反映事物的过去、现在和将来关系的一对范畴是","o":["内容和形式","本质和现象","原因和结果","现实和可能"],"a":3,"w":"五对范畴各管一件事：现实和可能管时间上的「现在与将来」，原因和结果管「前后相继」。看到「将来」就选现实和可能。","s":"2025年10月·第6题"},{"k":"b-d2-5","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"下列唯物辩证法范畴中反映事物根本性质和表面特征关系的是","o":["内容和形式","必然和偶然","本质和现象","可能性与现实性"],"a":2,"w":"「根本性质」对本质，「表面特征」对现象。内容和形式讲的是构成与表现方式，不是深浅。","s":"2021年10月·第4题"},{"k":"b-d2-6","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"假象同真象一样，也是客观存在的。这是一种","o":["唯物辩证法的观点","形而上学的观点","折衷主义的观点","诡辩论的观点"],"a":0,"w":"假象也是本质的一种表现，是客观的，不是人主观造出来的——这正是唯物辩证法的立场。","s":"2021年4月·第6题"},{"k":"b-d2-7","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"在世界如何存在的问题上，两种根本对立的观点是","o":["唯物与唯心","辩证法和形而上学","一元和二元","可知与不可知"],"a":1,"w":"「世界是什么」分唯物唯心；「世界怎么存在」分辩证法和形而上学。抓住题干问的是「如何存在」。","s":"2021年10月·第3题"},{"k":"b-d2-8","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"把世界的本质或本原归结为某一种或某几种具体的物质形态，这种观点属于","o":["古代朴素唯物主义","庸俗唯物主义","形而上学唯物主义","辩证唯物主义"],"a":0,"w":"水、火、气这类「具体物质形态」是古代朴素唯物主义的标志。形而上学唯物主义归结为原子。","s":"2023年4月·第4题"},{"k":"b-d2-9","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"承认世界具有统一性的哲学就是","o":["唯物论","辩证法","一元论","可知论"],"a":2,"w":"一元论＝承认世界有统一的本原。至于本原是物质还是精神，那是唯物唯心的分歧，是下一层。","s":"2021年4月·第3题"},{"k":"b-d2-10","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"在一元论上，唯物主义与唯心主义的共同点是承认世界的","o":["同一性","可知性","统一性","物质性"],"a":2,"w":"唯心主义一元论也承认世界有统一本原，只是认为那个本原是精神。共同点是「统一性」，不是「物质性」。","s":"2023年4月·第2题"},{"k":"b-d2-11","day":"d2","topic":"辩证法与哲学派别","cls":"zhe","q":"与自然规律相比，社会规律","o":["不具有客观性","是通过各种盲目力量实现的","不具有普遍性","是通过人的自觉活动实现的"],"a":3,"w":"社会规律照样客观、普遍，唯一的不同是它必须通过人的自觉活动才实现。凡是说社会规律「不客观」的都是错的。","s":"2020年10月·第5题"},{"k":"b-d3-0","day":"d3","topic":"认识论与真理","cls":"zhe","q":"唯物主义一元论与唯心主义一元论的区别在于是否承认","o":["世界万物的本原只有一个","世界万物的本原是物质","检验真理的标准只有一个","检验真理的标准是实践"],"a":1,"w":"两者都承认本原只有一个（都是一元论），区别在于那个本原是不是物质。A 是它们的共同点，不是区别。","s":"2023年10月·第3题"},{"k":"b-d3-1","day":"d3","topic":"认识论与真理","cls":"zhe","q":"“认识的本质是主体在实践基础上对客体的能动反映”，这是一种","o":["主观唯心主义认识论观点","客观唯心主义认识论观点","辩证唯物主义认识论观点","旧唯物主义认识论观点"],"a":2,"w":"两个关键词：实践基础 + 能动反映。旧唯物主义只承认反映不承认能动，也不讲实践。","s":"2025年10月·第7题"},{"k":"b-d3-2","day":"d3","topic":"认识论与真理","cls":"zhe","q":"认识是主体对客体的能动反映，这是一种","o":["机械唯物主义认识论观点","辩证唯物主义认识论观点","主观唯心主义认识论观点","客观唯心主义认识论观点"],"a":1,"w":"只要出现「能动反映」四个字，答案就是辩证唯物主义。机械（旧）唯物主义对应的是「直观反映」。","s":"2023年4月·第7题"},{"k":"b-d3-3","day":"d3","topic":"认识论与真理","cls":"zhe","q":"下列各项属于辩证唯物主义观点的是","o":["认识是从天上掉下来的","认识是主体对客体的直观反映","认识是人脑主观自生的","认识是主体对客体的能动反映"],"a":3,"w":"四个选项刚好是四种立场：A 客观唯心，B 旧唯物，C 主观唯心，D 辩证唯物。记住这张四象限表，这类题全送分。","s":"2023年10月·第7题"},{"k":"b-d3-4","day":"d3","topic":"认识论与真理","cls":"zhe","q":"感性认识与理性认识的区别在于","o":["前者是主观的，后者是客观的","前者源于实践，后者源于内省","前者是抽象的思维，后者是生动的直观","前者反映事物现象，后者揭示事物本质"],"a":3,"w":"感性看表面现象，理性抓内在本质。C 把两者说反了，是常见倒置型干扰项。","s":"2023年4月·第8题"},{"k":"b-d3-5","day":"d3","topic":"认识论与真理","cls":"zhe","q":"理性认识的三种形式是","o":["感觉、概念、判断","概念、判断、推理","感觉、知觉、表象","感觉、知觉、推理"],"a":1,"w":"感性三形式：感觉→知觉→表象；理性三形式：概念→判断→推理。六个词分两组，顺序也要对。","s":"2022年4月·第8题"},{"k":"b-d3-6","day":"d3","topic":"认识论与真理","cls":"zhe","q":"轻视理性认识而片面夸大感性认识的作用，会导致实践中的","o":["实用主义","怀疑主义","教条主义","经验主义"],"a":3,"w":"夸大感性＝经验主义，夸大理性＝教条主义。一句话记：只信经验的是经验主义。","s":"2025年10月·第8题"},{"k":"b-d3-7","day":"d3","topic":"认识论与真理","cls":"zhe","q":"哲学史上的唯理论和经验论的错误在于","o":["割裂了感性认识和理性认识的联系","颠倒了直接经验和间接经验的关系","混淆了正确认识和错误认识的区别","模糊了绝对真理和相对真理的界限"],"a":0,"w":"唯理论只要理性，经验论只要感性，共同毛病是把两者割裂开。","s":"2023年10月·第8题"},{"k":"b-d3-8","day":"d3","topic":"认识论与真理","cls":"zhe","q":"实践是检验真理的唯一标准，这是因为","o":["实践是人类生存和发展的基础","实践是人类社会生活的本质","实践是真理和价值统一的基础","实践具有直接现实性的品质"],"a":3,"w":"问「为什么能当标准」，答案只能是「直接现实性」——它能把想法变成看得见的结果。其余三项本身没错，但答非所问。","s":"2025年10月·第9题"},{"k":"b-d3-9","day":"d3","topic":"认识论与真理","cls":"zhe","q":"在真理的检验标准问题上，下列各项中说法正确的是","o":["多数人认可的就是真理","个人觉得有用的就是真理","少数人坚持的就是真理","在实践中证实的才是真理"],"a":3,"w":"凡是把标准放在「人怎么想」上的选项都错。标准只有一个：实践。","s":"2018年10月·第9题"},{"k":"b-d3-10","day":"d3","topic":"认识论与真理","cls":"zhe","q":"在检验认识真理性的问题上，下列各项正确说明实践标准与逻辑证明关系的是","o":["实践标准具有绝对性，无需逻辑证明补充","实践标准具有相对性，必须逻辑证明补充","被逻辑证明了的认识，最终还要用实践来检验","逻辑证明可以取代实践成为检验真理的标准"],"a":2,"w":"逻辑证明是辅助，不能取代实践；实践才有最后的权威。A 太绝对，D 直接错。","s":"2023年4月·第9题"},{"k":"b-d3-11","day":"d3","topic":"认识论与真理","cls":"zhe","q":"被称为马克思主义哲学的精髓、党的思想路线的核心的是","o":["一切从实际出发","理论联系实际","解放思想","实事求是"],"a":3,"w":"「精髓」「核心」这两个词只对应实事求是。思想路线一共四句，核心那句就是它。","s":"2023年10月·第9题"},{"k":"b-d4-0","day":"d4","topic":"唯物史观","cls":"zhe","q":"社会历史观的基本问题是","o":["社会存在和社会意识的关系问题","物质文明和精神文明协调发展的问题","社会革命和社会改革的关系问题","群众、阶级、政党、领袖的关系问题"],"a":0,"w":"哲学基本问题是思维和存在的关系，搬到社会上就是社会存在和社会意识的关系。这是唯物史观的入口。","s":"2025年10月·第11题"},{"k":"b-d4-1","day":"d4","topic":"唯物史观","cls":"zhe","q":"对社会存在和社会意识关系问题的不同回答是","o":["划分唯物主义和唯心主义的标准","划分可知论和不可知论的标准","划分唯物史观和唯心史观的标准","划分辩证法和形而上学的标准"],"a":2,"w":"注意题干说的是「社会」存在和「社会」意识，所以划分的是史观，不是一般的唯物唯心。A 就是没看清「社会」两个字的人会选的。","s":"2022年4月·第10题"},{"k":"b-d4-2","day":"d4","topic":"唯物史观","cls":"zhe","q":"社会存在即社会物质生活条件，是社会生活的物质方面。下列选项中不属于社会存在的是","o":["自然地理环境","政治法律思想","物质生产方式","人口因素"],"a":1,"w":"社会存在三样：地理环境、人口因素、物质生产方式。政治法律思想是社会意识，属于上层建筑。","s":"2025年10月·第12题"},{"k":"b-d4-3","day":"d4","topic":"唯物史观","cls":"zhe","q":"地理环境在社会发展中的作用表现为","o":["它决定社会制度的性质","它影响和制约社会的发展","它决定社会形态的更替","它决定社会生产力的水平"],"a":1,"w":"地理环境和人口因素都只能「影响制约」，不能「决定」。凡是让它们「决定」什么的选项一律排除。","s":"2023年4月·第10题"},{"k":"b-d4-4","day":"d4","topic":"唯物史观","cls":"zhe","q":"人口因素在社会发展中的作用表现为","o":["影响社会阶层的划分","影响社会发展的速度","决定社会制度的性质","决定社会形态的更替"],"a":1,"w":"同一条规则：人口只能影响快慢，不能决定性质。真正起决定作用的是物质生产方式。","s":"2023年10月·第10题"},{"k":"b-d4-5","day":"d4","topic":"唯物史观","cls":"zhe","q":"在现代生产力系统中，劳动者、劳动资料和劳动对象属于","o":["准备性因素","运筹性因素","实体性因素","渗透性因素"],"a":2,"w":"看得见摸得着的三样是实体性因素；科学技术是渗透性因素，教育是准备性因素，管理是运筹性因素。","s":"2023年10月·第11题"},{"k":"b-d4-6","day":"d4","topic":"唯物史观","cls":"zhe","q":"衡量生产力水平的客观尺度是","o":["生产工具的状况","劳动对象的广度","劳动产品的数量","劳动产品的质量"],"a":0,"w":"生产工具是尺度，劳动者是最活跃的因素。这两个「最」经常一起考，别对调。","s":"2022年4月·第11题"},{"k":"b-d4-7","day":"d4","topic":"唯物史观","cls":"zhe","q":"下列各项正确说明经济基础与上层建筑关系的是","o":["经济基础的性质决定上层建筑的性质","上层建筑的性质决定经济基础的性质","上层建筑的变化决定经济基础的变化","上层建筑各个部分都随经济基础的变化而同步变化"],"a":0,"w":"经济基础决定上层建筑，上层建筑只能反作用。D 错在「同步」——上层建筑有相对独立性，会滞后。","s":"2025年10月·第13题"},{"k":"b-d4-8","day":"d4","topic":"唯物史观","cls":"zhe","q":"在经济基础和上层建筑这对矛盾当中","o":["经济基础是矛盾的主要方面","经济基础应上层建筑的需要产生","上层建筑是矛盾的主要方面","上层建筑是经济基础的物质根源"],"a":0,"w":"谁起决定作用谁就是矛盾的主要方面。这里是经济基础。","s":"2023年4月·第11题"},{"k":"b-d4-9","day":"d4","topic":"唯物史观","cls":"zhe","q":"社会形态是","o":["自然界与人类社会的统一","地理环境与人口因素的统一","生产力与生产关系的统一","经济基础与上层建筑的统一"],"a":3,"w":"社会形态＝经济基础＋上层建筑。C 说的是另一对关系，看着顺眼但不是答案。","s":"2023年10月·第12题"},{"k":"b-d4-10","day":"d4","topic":"唯物史观","cls":"zhe","q":"社会历史发展的动力是多方面的，其中作为基本动力的是","o":["社会基本矛盾","阶级斗争","科学技术革命","社会改革"],"a":0,"w":"B、C、D 都是动力，但只有社会基本矛盾是「基本」动力。题干里的限定词决定答案。","s":"2023年10月·第13题"},{"k":"b-d4-11","day":"d4","topic":"唯物史观","cls":"zhe","q":"人的本质在于","o":["人的道德素质","人的法治素养","人的自然属性","人的社会属性"],"a":3,"w":"人的本质是一切社会关系的总和，所以在于社会属性而非自然属性。","s":"2023年4月·第12题"},{"k":"b-d5-0","day":"d5","topic":"商品与价值","cls":"jing","q":"商品经济产生和存在的决定性条件是","o":["商品生产","商品交换","社会分工","生产资料和劳动产品属于不同的所有者"],"a":3,"w":"两个条件：社会分工是一般条件，不同所有者是决定性条件。问「决定性」就选后者。","s":"2023年4月·第14题"},{"k":"b-d5-1","day":"d5","topic":"商品与价值","cls":"jing","q":"商品经济得以产生的社会历史条件，除了生产资料和劳动产品属于不同所有者之外，还有一个，即","o":["存在自然分工","存在社会分工","存在部落内部分工","存在部落间分工"],"a":1,"w":"上一题的补位问法：另一个条件是社会分工。注意是「社会分工」，不是自然分工。","s":"2026年4月·第14题"},{"k":"b-d5-2","day":"d5","topic":"商品与价值","cls":"jing","q":"商品二因素中反映人与自然之间的物质关系、属于商品自然属性的因素，是商品的","o":["使用价值","交换价值","价值","价格"],"a":0,"w":"使用价值＝自然属性＝人与自然；价值＝社会属性＝人与人。这条线是整块政经的基准线。","s":"2026年4月·第15题"},{"k":"b-d5-3","day":"d5","topic":"商品与价值","cls":"jing","q":"以下关于商品使用价值的表述中不正确的是","o":["使用价值是价值的物质承担者","使用价值是商品的自然属性","同一物品只能有一种使用价值","没有使用价值的物品不可能有价值"],"a":2,"w":"本题问「不正确」，别看反。一块铁可以打刀也可以做锅，使用价值是多方面的，所以 C 错。","s":"2022年4月·第15题"},{"k":"b-d5-4","day":"d5","topic":"商品与价值","cls":"jing","q":"在商品经济中，生产商品的劳动具有二重性，这里的劳动二重性是指","o":["具体劳动和抽象劳动","活劳动和物化劳动","体力劳动和脑力劳动","私人劳动和社会劳动"],"a":0,"w":"二重性＝具体劳动＋抽象劳动。D 是「基本矛盾」，被放进来当陪跑，这是最高频的一个坑。","s":"2023年10月·第14题"},{"k":"b-d5-5","day":"d5","topic":"商品与价值","cls":"jing","q":"从商品二因素与劳动二重性的关系考察，商品经济中能够形成商品价值的劳动是","o":["具体劳动","体力劳动","抽象劳动","脑力劳动"],"a":2,"w":"具体劳动创造使用价值，抽象劳动形成价值。「创造」配使用价值，「形成」配价值，连动词都是固定的。","s":"2025年10月·第14题"},{"k":"b-d5-6","day":"d5","topic":"商品与价值","cls":"jing","q":"决定商品价值量的是","o":["物化劳动时间","活劳动时间","个别劳动时间","社会必要劳动时间"],"a":3,"w":"永远是社会必要劳动时间。个别劳动时间只影响这一家企业赚多赚少，不决定价值量。","s":"2023年4月·第15题"},{"k":"b-d5-7","day":"d5","topic":"商品与价值","cls":"jing","q":"单位商品的价值量与生产该商品的劳动生产率","o":["成正比","成反比","同比例变化","没有关系"],"a":1,"w":"效率越高，一件东西花的社会必要劳动时间越少，价值量越小——所以成反比。","s":"2021年4月·第14题"},{"k":"b-d5-8","day":"d5","topic":"商品与价值","cls":"jing","q":"下列关于商品价值量决定关系的表述中，正确的是","o":["商品的价值量与社会必要劳动时间成正比，与劳动生产率成反比","商品的价值量与社会必要劳动时间成反比，与劳动生产率成正比","商品的价值量与社会必要劳动时间成正比，与劳动生产率也成正比","商品的价值量与社会必要劳动时间成反比，与劳动生产率也成反比"],"a":0,"w":"一正一反：跟时间成正比，跟生产率成反比。这两句要一起背，考试常合在一个选项里。","s":"2025年10月·第15题"},{"k":"b-d5-9","day":"d5","topic":"商品与价值","cls":"jing","q":"简单商品经济的基本矛盾是指","o":["价值和使用价值的矛盾","价值和交换价值的矛盾","私人劳动和社会劳动的矛盾","具体劳动和抽象劳动的矛盾"],"a":2,"w":"基本矛盾只有一个答案：私人劳动和社会劳动。A、D 是另外两组「二」，专门用来干扰。","s":"2018年10月·第14题"},{"k":"b-d5-10","day":"d5","topic":"商品与价值","cls":"jing","q":"以私有制为基础的商品经济的基本矛盾是","o":["具体劳动和抽象劳动的矛盾","私人劳动和社会劳动的矛盾","个别劳动和一般劳动的矛盾","生产劳动和非生产劳动的矛盾"],"a":1,"w":"「简单商品经济」和「以私有制为基础的商品经济」说的是同一件事，答案也一样。","s":"2026年4月·第16题"},{"k":"b-d5-11","day":"d5","topic":"商品与价值","cls":"jing","q":"货币的五种职能中最基本的是","o":["世界货币和贮藏手段","贮藏手段和支付手段","价值尺度和流通手段","价值尺度和价格标准"],"a":2,"w":"五种职能里最基本的两个是价值尺度和流通手段，其余三个都是派生出来的。","s":"2020年10月·第14题"},{"k":"b-d6-0","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"货币转化为资本的前提是","o":["资本完成原始积累","商品生产者出现两极分化","劳动力成为商品","劳动者有人身自由"],"a":2,"w":"整个剩余价值理论的入口。D 只是劳动力成为商品的条件之一，不是那个「前提」本身。","s":"2022年4月·第16题"},{"k":"b-d6-1","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"资本主义社会中，劳动力成为商品要具备的基础条件，不包括","o":["劳动者在法律上是自由人","劳动者人身依附于资本家","劳动者没有生活资料来源","劳动者没有任何生产资料"],"a":1,"w":"问「不包括」。劳动力成为商品恰恰要求劳动者人身自由，人身依附是封建关系，正好相反。","s":"2025年10月·第16题"},{"k":"b-d6-2","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"必要劳动时间不变，通过工作日的延长而生产的剩余价值是","o":["绝对剩余价值","相对剩余价值","超额剩余价值","平均剩余价值"],"a":0,"w":"判别关键词：延长工作日＝绝对；缩短必要劳动时间＝相对；个别企业效率高＝超额。","s":"2022年4月·第17题"},{"k":"b-d6-3","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"相对剩余价值生产的条件是","o":["社会劳动生产率提高","个别企业劳动生产率提高","社会劳动生产率不变","部分生产部门的劳动生产率提高"],"a":0,"w":"相对剩余价值靠的是全社会效率提高；个别企业效率提高得到的是超额剩余价值。「社会」还是「个别」是分界线。","s":"2021年10月·第16题"},{"k":"b-d6-4","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"个别企业由于劳动生产率更高，从而使商品个别价值低于社会价值所获得的剩余价值是","o":["绝对剩余价值","相对剩余价值","超额剩余价值","平均剩余价值"],"a":2,"w":"个别价值低于社会价值＝超额剩余价值。凡是题干出现「个别企业」「率先采用新技术」，答案都是它。","s":"2023年4月·第16题"},{"k":"b-d6-5","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"剩余价值率反映的是","o":["不变资本的增殖程度","资本家对工人的剥削程度","固定资本的增殖程度","流动资本的增殖程度"],"a":1,"w":"剩余价值率＝剩余价值÷可变资本，衡量的是剥削程度；利润率才衡量增殖程度。","s":"2020年10月·第15题"},{"k":"b-d6-6","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"从资本循环周转的角度考察，资本家用于购买机器设备的资本属于","o":["可变资本","不变资本","流动资本","固定资本"],"a":3,"w":"题干说「从资本循环周转的角度」，那就用固定/流动这套分法，答固定资本。如果问的是增殖作用，才答不变资本。同一台机器两个身份，看题干用哪把尺子。","s":"2023年10月·第16题"},{"k":"b-d6-7","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"从资本循环角度看，资本家工厂中已经进入仓库的产成品，属于产业资本循环中的","o":["货币资本形态","生产资本形态","商品资本形态","固定资本形态"],"a":2,"w":"产业资本循环三形态：货币资本→生产资本→商品资本。做好待卖的东西就是商品资本。D 又是另一套分法的干扰项。","s":"2026年4月·第18题"},{"k":"b-d6-8","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"生产资料和劳动力在构成上的比例是","o":["资本的技术构成","资本的价值构成","资本的有机构成","资本的数量构成"],"a":0,"w":"按实物量算的比例叫技术构成；按价值算的叫价值构成；由技术构成决定并反映其变化的价值构成才叫有机构成。","s":"2023年4月·第18题"},{"k":"b-d6-9","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"以下不属于资本积累后果的是","o":["资本有机构成提高","工作日的延长","相对过剩人口的形成","贫富两极分化扩大"],"a":1,"w":"问「不属于」。延长工作日是生产绝对剩余价值的手段，不是资本积累带来的后果。","s":"2021年10月·第17题"},{"k":"b-d6-10","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"平均利润率是","o":["社会的利润总量与社会预付可变资本的比率","社会的利润总量与社会预付不变资本的比率","社会的剩余价值总量与社会预付可变资本的比率","社会的剩余价值总量与社会预付总资本的比率"],"a":3,"w":"分子是全社会剩余价值总量，分母是全社会预付总资本。分母只要出现「可变资本」的，那是剩余价值率。","s":"2020年10月·第18题"},{"k":"b-d6-11","day":"d6","topic":"剩余价值与资本","cls":"jing","q":"资本主义再生产周期通常包括四个阶段，其中作为必经阶段和基本阶段的是","o":["危机阶段","萧条阶段","复苏阶段","高涨阶段"],"a":0,"w":"四阶段：危机→萧条→复苏→高涨。危机是周期的起点，也是必经和基本阶段。","s":"2025年10月·第17题"},{"k":"b-d7-0","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"19世纪末20世纪初形成的垄断资本主义主要以私人垄断资本为基础。私人垄断资本主义形成的基础是","o":["生产集中和市场集中","生产集中和资本集中","资本集中和市场集中","技术集中和资本集中"],"a":1,"w":"固定搭配：生产集中和资本集中发展到一定程度必然产生垄断。出现「市场集中」「技术集中」的都是编的。","s":"2026年4月·第19题"},{"k":"b-d7-1","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断资本主义形成于19世纪末20世纪初，由于这一时期的垄断资本主义主要以私人垄断资本为基础，因此又被称为","o":["私人垄断资本主义","垄断竞争资本主义","国家垄断资本主义","金融垄断资本主义"],"a":0,"w":"两个阶段要分清：二战前是私人垄断，二战后国家干预加强才叫国家垄断资本主义。","s":"2025年10月·第19题"},{"k":"b-d7-2","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断是通过一定的垄断组织形式实现的。在一个或几个经济部门中占据垄断地位的大企业联合形成的垄断组织中，最简单、初级的形式是","o":["短期价格协定","长期价格协定","短期市场协定","长期市场协定"],"a":0,"w":"从松到紧：短期价格协定 → 卡特尔 → 辛迪加 → 托拉斯 → 康采恩 → 混合联合公司。最简单、最初级的是短期价格协定。","s":"2026年4月·第20题"},{"k":"b-d7-3","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"垄断利润的主要实现形式是垄断组织制定的","o":["市场规则","市场秩序","垄断规则","垄断价格"],"a":3,"w":"垄断利润靠垄断价格实现：卖的时候定高价，买的时候压低价。","s":"2023年10月·第18题"},{"k":"b-d7-4","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"金融寡头对国家机器的控制主要是通过","o":["参与制来实现","同政府的“个人联合”来实现","同政府的金融联系来实现","对政府项目的资本参与来实现"],"a":1,"w":"记两条线：控制经济靠「参与制」，控制国家机器靠「个人联合」。这两个最容易对调。","s":"2023年10月·第19题"},{"k":"b-d7-5","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"国家垄断资本主义对国民经济进行宏观调控的主要手段是","o":["经济手段和行政手段","法律手段和行政手段","经济手段和法律手段","法律手段和计划手段"],"a":2,"w":"主要手段是经济手段和法律手段，行政手段只在特定情况下偶尔使用。凡带「计划手段」的一律排除。","s":"2023年10月·第21题"},{"k":"b-d7-6","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"恩格斯在《在马克思墓前的讲话》中指出，马克思一生有两大发现。正是这两大发现为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。这两大发现是","o":["辩证唯物主义和历史唯物主义","唯物史观和剩余价值学说","劳动价值论和剩余价值学说","唯物论和辩证法"],"a":1,"w":"两大发现固定就是唯物史观＋剩余价值学说。A、D 说的是马克思主义哲学的组成，不是「发现」。","s":"2026年4月·第23题"},{"k":"b-d7-7","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"无产阶级夺取政权的第一次伟大尝试是","o":["第一国际成立","巴黎公社革命","第二国际成立","十月革命"],"a":1,"w":"巴黎公社是第一次「尝试」，十月革命才是第一次「成功」并建立国家。尝试和成功是两个词。","s":"2025年10月·第23题"},{"k":"b-d7-8","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"世界上第一个社会主义国家是","o":["波兰人民共和国","苏维埃俄国","法国巴黎公社","中华人民共和国"],"a":1,"w":"1917年十月革命建立苏维埃俄国。巴黎公社是政权尝试，不是国家。","s":"2023年4月·第23题"},{"k":"b-d7-9","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"社会主义国家的最高政治领导力量是","o":["工会","社会党","共产党","共青团"],"a":2,"w":"最高政治领导力量是共产党。注意「社会党」不是共产党，是个干扰项。","s":"2025年10月·第24题"},{"k":"b-d7-10","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"实现了阶级的消灭和国家的消亡的社会是","o":["社会主义社会","共产主义社会","民主法治社会","信息网络社会"],"a":1,"w":"社会主义阶段国家还在、阶级差别还在；只有共产主义才实现阶级消灭和国家消亡。","s":"2023年10月·第25题"},{"k":"b-d7-11","day":"d7","topic":"垄断与科学社会主义","cls":"ke","q":"共产主义社会的根本特征是","o":["人与自然和谐共生","人们的精神境界极大提高","社会关系高度和谐","实现人的自由而全面的发展"],"a":3,"w":"四个都是共产主义的特征，但问「根本」特征只有一个：人的自由而全面的发展。限定词决定答案。","s":"2025年10月·第25题"}]};

const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX=(()=>{
  const cv=$('#fx'),ctx=cv.getContext('2d');let W=0,H=0,parts=[],run=false;
  function rs(){const r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(r,0,0,r,0,0);}
  rs();addEventListener('resize',rs);
  const COL=['#7B61FF','#FF8FB1','#FFC83D','#1DBF94','#3AA8FF','#FF6B6B'];
  function add(p){parts.push(p);if(!run){run=true;requestAnimationFrame(tick);}}
  function burst(x,y,n=30,pw=1){if(REDUCE)n=Math.min(n,6);for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(2.5+Math.random()*6)*pw;
    add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3.5*pw,g:.22,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,s:4+Math.random()*6,c:COL[i%6],sh:i%3,l:80+Math.random()*50});}}
  function rain(n=140){if(REDUCE)n=20;for(let i=0;i<n;i++)add({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.04,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:5+Math.random()*6,c:COL[i%6],sh:i%3,l:260});}
  function star(s){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.42:s,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();}
  function tick(){ctx.clearRect(0,0,W,H);parts=parts.filter(p=>p.l>0&&p.y<H+40);
    for(const p of parts){p.vx*=.99;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;ctx.save();ctx.globalAlpha=Math.min(1,p.l/30);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.sh===0){ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill();}else if(p.sh===1)ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else star(p.s*.7);ctx.restore();}
    if(parts.length)requestAnimationFrame(tick);else{run=false;ctx.clearRect(0,0,W,H);}}
  function float(t,x,y,cls='xp'){const e=document.createElement('div');e.className='float '+cls;e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1050);}
  function toast(h,cls=''){const e=document.createElement('div');e.className='toast '+cls;e.innerHTML=h;$('#toasts').appendChild(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),260);},2600);}
  function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  function combo(t){const e=document.createElement('div');e.className='combo-pop';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1150);}
  return {burst,rain,float,toast,shake,combo};
})();

function tone(f,t0,dur,type='sine',vol=.1,f2){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);}catch(e){}}
